[platformio]
default_envs = esp32-c3

[env]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
build_flags =
    -D TFT_BUTTON_TEST=1
    -D TFT_SPI_HZ=8000000
    -D TFT_ROTATION=1
    -D TFT_INVERT=0
    -D TFT_SWAP_RB=0
    -D TFT_TEST_ONLY=0
; Optional panel alignment: -D TFT_COLSTART=26 -D TFT_ROWSTART=1
; TFT_BUTTON_TEST=1: GPIO1 button cycles solid colors. Set 0 to play video.
; Optional playback speed override: -D PLAYBACK_FPS=10

[env:esp32-c3]
; Serial via a USB-to-UART bridge.

[env:esp32-c3-usb]
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; Do not upload until the actual board and port have been confirmed.
