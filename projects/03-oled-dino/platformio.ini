[platformio]
default_envs = esp32-c3

[env]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit SSD1306@2.5.13

; Default: board with an external USB-to-UART bridge.
[env:esp32-c3]

; Select only for a board wired directly to the ESP32-C3 USB port.
[env:esp32-c3-usb]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; No upload_port is selected. Verify the actual board and COM port first.
