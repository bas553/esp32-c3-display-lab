[platformio]
default_envs = esp32-c3

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit SSD1306@2.5.13
build_flags =
    -D OLED_I2C_HZ=400000
; Change OLED_I2C_HZ to 100000 for slower I2C.
; Optional: -D PLAYBACK_FPS=10 overrides the FPS generated in the header.

[env:esp32-c3]
; Serial through the board's external USB-to-UART bridge.

[env:esp32-c3-usb]
; Select only for USB wired directly to the ESP32-C3.
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; Select the verified upload/monitor port only after user confirmation.
